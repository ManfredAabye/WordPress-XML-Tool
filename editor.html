<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>HTML Editor mit Monaco</title>
  <style>
    html, body { height: 100%; margin: 0; padding: 0; }
    #container { width: 100%; height: 100vh; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
  <script>
    var editor;
    function setContent(content) {
      if (editor) editor.setValue(content);
    }
    function getContent() {
      return editor ? editor.getValue() : "";
    }
    window.addEventListener('DOMContentLoaded', function() {
      require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' } });
      require(['vs/editor/editor.main'], function() {
        editor = monaco.editor.create(document.getElementById('container'), {
          value: '',
          language: 'html',
          theme: 'vs-dark',
          automaticLayout: true,
          minimap: { enabled: false },
          fontSize: 16
        });
        // Initialwert aus Query-String (Base64 für volle Kompatibilität)
        const params = new URLSearchParams(window.location.search);
        if (params.has('content_b64')) {
          try {
            // Base64 zu Uint8Array, dann zu UTF-8-String
            const b64 = params.get('content_b64');
            const binStr = atob(b64);
            const bytes = new Uint8Array(binStr.length);
            for (let i = 0; i < binStr.length; i++) bytes[i] = binStr.charCodeAt(i);
            const decoded = new TextDecoder('utf-8').decode(bytes);
            editor.setValue(decoded);
          } catch (e) {
            editor.setValue('Fehler beim Dekodieren des Inhalts!');
          }
        } else if (params.has('content')) {
          // Fallback für alte Links
          editor.setValue(decodeURIComponent(params.get('content')));
        }
      });
    });
  </script>
</head>
<body>
  <div id="container"></div>
</body>
</html>
